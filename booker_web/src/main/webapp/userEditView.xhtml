<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:p="http://primefaces.org/ui"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                template="/templates/main-template.xhtml">

    <ui:define name="title">Booker - Edycja użytkownika</ui:define>

    <ui:define name="content">
        <f:metadata>
            <f:viewAction action="#{userEditBB.onLoad()}" />
            <f:event type="preRenderView" listener="#{messageBB.preRenderMsg()}" />
        </f:metadata>

        <p:panel header="Edycja danych użytkownika" style="max-width: 600px; margin: 0 auto;">
            <h:form id="form-edit">
                <h:panelGrid columns="3" cellpadding="6" style="width: 100%;">
                    <p:outputLabel for="p-login" value="Login:" />
                    <p:inputText id="p-login" value="#{userEditBB.loginF}" required="true" requiredMessage="Wpisz nazwę użytkownika" validatorMessage="Długość: 3-30 znaków">
                        <f:validateLength minimum="3" maximum="30" />
                    </p:inputText>
                    <p:message for="p-login" display="icon"/>

                    <p:outputLabel for="p-pass" value="Hasło:" />
                    <p:password id="p-pass" value="#{userEditBB.passwordF}" required="true" requiredMessage="Wpisz hasło" validatorMessage="Długość: 3-30 znaków">
                        <f:validateLength minimum="3" maximum="30" />
                    </p:password>
                    <p:message for="p-pass" display="icon"/>
                    
                    <p:outputLabel for="p-passr" value="Powtórz hasło:" />
                    <p:password id="p-passr" value="#{userEditBB.passwordFR}" required="true" requiredMessage="Wpisz ponownie hasło"/>
                    <p:message for="p-passr" display="icon"/>
                </h:panelGrid>

                <p:fieldset legend="Uprawnienia i role" style="margin-top: 1rem; margin-bottom: 1rem;">
                    <div style="display: flex; gap: 2rem;">
                        <p:selectBooleanCheckbox value="#{userEditBB.chckbxUserF}" itemLabel="Użytkownik" />
                        <p:selectBooleanCheckbox value="#{userEditBB.chckbxWorkerF}" itemLabel="Pracownik" />
                        <p:selectBooleanCheckbox value="#{userEditBB.chckbxAdminF}" itemLabel="Administrator" />
                    </div>
                </p:fieldset>

                <p:messages id="msgs" showDetail="false" closable="true" style="margin-bottom: 1rem;" />

                <div style="margin-top: 1rem;">
                    <p:commandButton value="Zapisz zmiany" action="#{userEditBB.saveData()}" icon="pi pi-save" style="margin-right: 0.5rem;" update="@form" />
                    <p:button value="Anuluj" outcome="userListView" icon="pi pi-times" styleClass="ui-button-secondary" />
                </div>
            </h:form>
        </p:panel>
    </ui:define>

</ui:composition>
