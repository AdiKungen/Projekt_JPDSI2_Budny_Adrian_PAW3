<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:p="http://primefaces.org/ui"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                template="/templates/main-template.xhtml">

    <ui:define name="title">Booker - Logowanie</ui:define>

    <ui:define name="content">
        <f:metadata>
            <f:event type="preRenderView" listener="#{messageBB.preRenderMsg()}" />
        </f:metadata>

        <div style="display: flex; justify-content: center; padding-top: 2rem;">
            <p:panel header="Logowanie do systemu" style="width: 100%; max-width: 420px;">
                <h:form>
                    <h:panelGrid id="grid" columns="2" cellpadding="8" style="width: 100%;">
                        <p:outputLabel for="login" value="Nazwa użytkownika:" />
                        <p:inputText id="login" value="#{loginBB.login}" required="true" requiredMessage="Wpisz nazwę użytkownika" style="width: 100%;"/>
                    
                        <p:outputLabel for="password" value="Hasło:" />
                        <p:password id="password" value="#{loginBB.password}" required="true" requiredMessage="Wpisz hasło" style="width: 100%;"/>
                    </h:panelGrid>
                    
                    <p:messages id="msgs" showDetail="false" closable="true" style="margin-bottom: 1rem;" />
                    
                    <div style="text-align: right; margin-top: 1.5rem;">
                        <p:commandButton value="Zaloguj się" action="#{loginBB.login()}" update="msgs" icon="pi pi-sign-in" style="width: 100%;"/>
                    </div>
                </h:form>
            </p:panel>
        </div>
    </ui:define>

</ui:composition>
